<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PCL Cockpit Companion</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #10b981;
    }
    .status-badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: #064e3b;
      color: #6ee7b7;
    }
    .info-box {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.5;
      color: #94a3b8;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      background: #10b981;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">PCL Cockpit Companion</span>
    <span class="status-badge">SOBERANO</span>
  </div>
  <div class="info-box">
    <strong>Enclave Conectado:</strong> http://localhost:3001<br>
    <strong>Invariante VRAM:</strong> 0 MB (CPU INT8)<br>
    <strong>Trivial Gate HitL:</strong> Ativo & Auditado
  </div>
  <a href="http://localhost:3001" target="_blank" class="btn">Abrir PCL Cockpit (:3001)</a>
</body>
</html>
