<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">Observability &amp; Audit Trail Dataflow</title>
        <desc id="archify-diagram-description">Fluxo de Coleta de Logs, Mapeamento de Tokens, Telemetria e Auditoria no pcl-db</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Data Stages -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="0" x="16" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="100" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">01 / Emissão</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="1" x="231" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="315" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">02 / Captura</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="2" x="446" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="530" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">03 / Estruturação</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="3" x="661" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="745" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">04 / Persistência</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="4" x="876" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="960" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">05 / Auditoria</text>

        <!-- Flow paths -->
        <path data-edge-from="cli_runner" data-edge-to="log_collector" data-edge-label="streams de log" data-edge-key="0" data-edge-id="cli-collector" data-composition-points="156,271;259,271" d="M 156 271 L 259 271" class="a-default" data-animate="edge" style="--step:0" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <path data-edge-from="log_collector" data-edge-to="parser" data-edge-label="normalização" data-edge-key="1" data-edge-id="collector-parser" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="parser" data-edge-to="pcl_db" data-edge-label="grava logs" data-edge-key="2" data-edge-id="parser-db" data-composition-points="586,271;689,271" d="M 586 271 L 689 271" class="a-emphasis" data-animate="edge" style="--step:2" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="pcl_db" data-edge-to="paperclip_ui" data-edge-label="exibe métricas" data-edge-key="3" data-edge-id="db-paperclip" data-composition-points="801,271;904,271" d="M 801 271 L 904 271" class="a-security" data-animate="edge" style="--step:3" stroke-width="1.4" marker-end="url(#arrowhead-security)"/>

        <!-- Nodes -->
        <g id="node-cli_runner" data-node-id="cli_runner" data-node-label="Agentes &amp; CLI" tabindex="0" role="button" aria-label="Focus Agentes &amp; CLI, execução de tarefas, 01 / Emissão" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="execução de tarefas" data-node-tag="emissão" data-node-context="01 / Emissão">
          <title>Agentes &amp; CLI · execução de tarefas · 01 / Emissão · emissão</title>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-frontend" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(50 248) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-detail-anchor x="100" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Agentes &amp; CLI</text>
          <text data-detail="context" x="100" y="279" class="t-muted" font-size="7" text-anchor="middle">execução de tarefas</text>
        <text data-detail="fine" x="100" y="289" class="t-frontend" font-size="7" text-anchor="middle">emissão</text>
        </g>

        <g id="node-log_collector" data-node-id="log_collector" data-node-label="Log Collector" tabindex="0" role="button" aria-label="Focus Log Collector, stdout e stderr, 02 / Captura" aria-pressed="false" data-node-kind="cloud" data-node-sublabel="stdout e stderr" data-node-tag="ingestão" data-node-context="02 / Captura">
          <title>Log Collector · stdout e stderr · 02 / Captura · ingestão</title>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-cloud" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="cloud" class="semantic-sigil s-cloud" transform="translate(265 248) scale(0.6875)">
            <path d="M4.3 12.5h7.3a2.4 2.4 0 0 0 .2-4.8 4 4 0 0 0-7.5-1.3A3.1 3.1 0 0 0 4.3 12.5Z"/>
          </g>
          <text data-detail-anchor x="315" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Log Collector</text>
          <text data-detail="context" x="315" y="279" class="t-muted" font-size="7" text-anchor="middle">stdout e stderr</text>
        <text data-detail="fine" x="315" y="289" class="t-cloud" font-size="7" text-anchor="middle">ingestão</text>
        </g>

        <g id="node-parser" data-node-id="parser" data-node-label="JSON Parser" tabindex="0" role="button" aria-label="Focus JSON Parser, métricas de tokens, 03 / Estruturação" aria-pressed="false" data-node-kind="backend" data-node-sublabel="métricas de tokens" data-node-tag="telemetria" data-node-context="03 / Estruturação">
          <title>JSON Parser · métricas de tokens · 03 / Estruturação · telemetria</title>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(480 248) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-detail-anchor x="530" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">JSON Parser</text>
          <text data-detail="context" x="530" y="279" class="t-muted" font-size="7" text-anchor="middle">métricas de tokens</text>
        <text data-detail="fine" x="530" y="289" class="t-backend" font-size="7" text-anchor="middle">telemetria</text>
        </g>

        <g id="node-pcl_db" data-node-id="pcl_db" data-node-label="pcl-db (Postgres)" tabindex="0" role="button" aria-label="Focus pcl-db (Postgres), tabela audit_logs, 04 / Persistência" aria-pressed="false" data-node-kind="database" data-node-sublabel="tabela audit_logs" data-node-tag="persistência" data-node-context="04 / Persistência">
          <title>pcl-db (Postgres) · tabela audit_logs · 04 / Persistência · persistência</title>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-database" data-animate="node" style="--step:3" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(695 248) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="745" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">pcl-db (Postgres)</text>
          <text data-detail="context" x="745" y="279" class="t-muted" font-size="7" text-anchor="middle">tabela audit_logs</text>
        <text data-detail="fine" x="745" y="289" class="t-database" font-size="7" text-anchor="middle">persistência</text>
        </g>

        <g id="node-paperclip_ui" data-node-id="paperclip_ui" data-node-label="PaperClip UI" tabindex="0" role="button" aria-label="Focus PaperClip UI, painel em :3100, 05 / Auditoria" aria-pressed="false" data-node-kind="security" data-node-sublabel="painel em :3100" data-node-tag="observabilidade" data-node-context="05 / Auditoria">
          <title>PaperClip UI · painel em :3100 · 05 / Auditoria · observabilidade</title>
          <rect x="904" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="904" y="242" width="112" height="58" rx="6" class="c-security" data-animate="node" style="--step:4" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="security" class="semantic-sigil s-security" transform="translate(910 248) scale(0.6875)">
            <path d="M8 2.2 13 4v3.5c0 3.1-1.8 5.4-5 6.5-3.2-1.1-5-3.4-5-6.5V4Z"/>
            <path d="m5.8 8 1.5 1.5 3-3"/>
          </g>
          <text data-detail-anchor x="960" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">PaperClip UI</text>
          <text data-detail="context" x="960" y="279" class="t-muted" font-size="7" text-anchor="middle">painel em :3100</text>
        <text data-detail="fine" x="960" y="289" class="t-security" font-size="7" text-anchor="middle">observabilidade</text>
        </g>

        <!-- Flow labels -->
        <g data-detail="context" data-edge-from="cli_runner" data-edge-to="log_collector" data-edge-label="streams de log" data-edge-key="0" data-edge-id="cli-collector">
          <rect x="167.2" y="250" width="80.6" height="27" rx="4" class="c-mask"/>
          <text x="207.5" y="261" class="t-muted" font-size="8" text-anchor="middle">streams de log</text>
        <text data-detail="fine" x="207.5" y="272" class="t-dim" font-size="7" text-anchor="middle">logs brutos</text>
        </g>
        <g data-detail="context" data-edge-from="log_collector" data-edge-to="parser" data-edge-label="normalização" data-edge-key="1" data-edge-id="collector-parser">
          <rect x="387.1" y="250" width="70.8" height="27" rx="4" class="c-mask"/>
          <text x="422.5" y="261" class="t-backend" font-size="8" text-anchor="middle">normalização</text>
        <text data-detail="fine" x="422.5" y="272" class="t-dim" font-size="7" text-anchor="middle">telemetria</text>
        </g>
        <g data-detail="context" data-edge-from="parser" data-edge-to="pcl_db" data-edge-label="grava logs" data-edge-key="2" data-edge-id="parser-db">
          <rect x="602.1" y="250" width="70.8" height="27" rx="4" class="c-mask"/>
          <text x="637.5" y="261" class="t-backend" font-size="8" text-anchor="middle">grava logs</text>
        <text data-detail="fine" x="637.5" y="272" class="t-dim" font-size="7" text-anchor="middle">estruturados</text>
        </g>
        <g data-detail="context" data-edge-from="pcl_db" data-edge-to="paperclip_ui" data-edge-label="exibe métricas" data-edge-key="3" data-edge-id="db-paperclip">
          <rect x="812.2" y="250" width="80.6" height="27" rx="4" class="c-mask"/>
          <text x="852.5" y="261" class="t-security" font-size="8" text-anchor="middle">exibe métricas</text>
        <text data-detail="fine" x="852.5" y="272" class="t-dim" font-size="7" text-anchor="middle">dashboards</text>
        </g>

        <!-- Legend -->
        <text x="214" y="664" class="t-primary" font-size="10" font-weight="600">Legend</text>
        <path d="M 214 684 L 248 684" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <text x="257" y="687" class="t-muted" font-size="8">primary data</text>
        <path d="M 340 684 L 374 684" class="a-security" stroke-width="1.4" marker-end="url(#arrowhead-security)"/>
        <text x="383" y="687" class="t-muted" font-size="8">policy / PII</text>
        <path d="M 480 684 L 514 684" class="a-dashed" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
        <text x="523" y="687" class="t-muted" font-size="8">async batch</text>
        <rect x="625" y="676" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="646" y="684" class="t-muted" font-size="8">data store</text>
      </svg>