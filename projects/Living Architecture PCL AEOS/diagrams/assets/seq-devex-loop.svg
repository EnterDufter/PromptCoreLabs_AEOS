<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">Developer Experience &amp; IDE Execution Loop</title>
        <desc id="archify-diagram-description">Ciclo de Interação entre Operador Humano, Antigravity IDE, Agente LLM e Harness</desc>
        <!-- Definitions -->
