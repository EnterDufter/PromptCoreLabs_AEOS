        <text x="238" y="98" class="t-cloud" font-size="9" font-weight="600">Host Storage &amp; Configurações</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="client" data-edge-to="mcp_config" data-edge-label="Lê Manifesto" data-edge-key="0" data-edge-id="client-config" data-composition-points="125,250;125,226;236,226;236,140;260,140" d="M 125 250 L 125 234 Q 125 226 133 226 L 228 226 Q 236 226 236 218 L 236 148 Q 236 140 244 140 L 260 140" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        <path data-edge-from="client" data-edge-to="cortex_mcp" data-edge-label="Gera Diagramas" data-edge-key="1" data-edge-id="client-cortex" data-composition-points="200,280;340,280;340,190;480,190" d="M 200 280 L 332 280 Q 340 280 340 272 L 340 198 Q 340 190 348 190 L 480 190" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="client" data-edge-to="notebooklm_mcp" data-edge-label="Consulta Notas" data-edge-key="2" data-edge-id="client-notebooklm" data-composition-points="125,310;125,334;456,334;456,370;480,370" d="M 125 310 L 125 326 Q 125 334 133 334 L 448 334 Q 456 334 456 342 L 456 362 Q 456 370 464 370 L 480 370" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="cortex_mcp" data-edge-to="workspace" data-edge-label="Salva Artefatos" data-edge-key="3" data-edge-id="cortex-workspace" data-composition-points="640,190;815,190;815,250" d="M 640 190 L 807 190 Q 815 190 815 198 L 815 250" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
