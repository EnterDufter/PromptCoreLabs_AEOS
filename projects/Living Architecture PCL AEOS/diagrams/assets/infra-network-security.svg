        <path data-edge-from="host_nic" data-edge-to="tailscale_vpn" data-edge-label="UDP WireGuard" data-edge-key="0" data-edge-id="nic-vpn" data-composition-points="190,273;225,273;225,180;260,180" d="M 190 273 L 217 273 Q 225 273 225 265 L 225 188 Q 225 180 233 180 L 260 180" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
