<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">Network &amp; Security Infrastructure Topology</title>
        <desc id="archify-diagram-description">Isolamento de Rede, Tunelamento Criptografado Tailscale e Portas Docker</desc>
        <!-- Definitions -->
        <defs>
