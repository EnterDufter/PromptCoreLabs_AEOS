name: pcl-aeos

services:
  db:
    image: postgres:17-alpine
    container_name: pcl-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperclip}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - aeos-net

  omniroute:
    build:
      context: ./OmniRoute
      dockerfile: Dockerfile
    image: omniroute:cli
    container_name: pcl-omniroute
    restart: always
    ports:
      - "${OMNIROUTE_BIND_ADDRESS:-127.0.0.1}:${OMNIROUTE_PORT:-20130}:20130"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./OmniRoute/.env
    environment:
      - PORT=20130
      - DATA_DIR=/var/lib/omniroute
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-admin}
      - AUTH_DISABLED=${OMNIROUTE_AUTH_DISABLED:-0}
      - SKIP_LOGIN=${OMNIROUTE_SKIP_LOGIN:-0}
      - REQUIRE_LOGIN=${OMNIROUTE_REQUIRE_LOGIN:-true}
      - CONFIG_FILE=/var/lib/omniroute/config.yaml
      - OMNIROUTE_CLASSIFIER_PROVIDER=laya
      - OMNIROUTE_LAYA_ENDPOINT=http://pcl-laya:20140
      - OMNIROUTE_CLASSIFIER_FAILOVER_ENABLED=true
    depends_on:
      - laya
    volumes:
      - omniroute-data:/var/lib/omniroute
      - ./config/omniroute/config.yaml:/var/lib/omniroute/config.yaml:ro
    networks:
      - aeos-net

  paperclip:
    build: 
      context: ./PaperClip
      dockerfile: Dockerfile
    container_name: pcl-paperclip
    restart: always
    ports:
      - "${PAPERCLIP_BIND_ADDRESS:-127.0.0.1}:${PAPERCLIP_PORT:-3100}:3100"
    depends_on:
      - db
      - omniroute
    env_file:
      - ./PaperClip/.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-paperclip}:${POSTGRES_PASSWORD:-paperclip}@db:5432/${POSTGRES_DB:-paperclip}
      - OMNI_ROUTE_URL=http://omniroute:20130
      - OPENAI_API_BASE=http://omniroute:20130/v1
      - OPENAI_API_KEY=sk-omniroute-local
      - PCL_HOME=/app
      - COMPANIES_DIR=/app/companies
    volumes:
      - paperclip-storage:/app/storage
      - ./PaperClip-Companies:/app/companies
    networks:
      - aeos-net

  laya:
    build:
      context: ./services/pcl-laya
      dockerfile: Dockerfile
    image: pcl-laya:latest
    container_name: pcl-laya
    restart: always
    ports:
      - "${LAYA_BIND_ADDRESS:-127.0.0.1}:${LAYA_PORT:-20140}:20140"
    environment:
      - PORT=20140
      - ONNXRUNTIME_EXECUTION_PROVIDERS=CPUExecutionProvider
      - LAYA_REQUIRE_NEURAL=${LAYA_REQUIRE_NEURAL:-0}
      - LAYA_CPU_THREADS=${LAYA_CPU_THREADS:-2}
    networks:
      - aeos-net

networks:
  aeos-net:
    driver: bridge

volumes:
  db-data:
    external: true
    name: promptcore_labs_db-data
  omniroute-data:
    external: true
    name: promptcore_labs_omniroute-data
  paperclip-storage:
    external: true
    name: promptcore_labs_paperclip-storage
