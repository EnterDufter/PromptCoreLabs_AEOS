name: pcl-aeos

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pcl-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperclip}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperclip} -d ${POSTGRES_DB:-paperclip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/database/migrations/001_create_memory_schema.sql:/docker-entrypoint-initdb.d/001_create_memory_schema.sql:ro
      - ./scripts/database/migrations/002_create_cockpit_artifacts_schema.sql:/docker-entrypoint-initdb.d/002_create_cockpit_artifacts_schema.sql:ro
      - ./scripts/database/migrations/003_create_cockpit_iam_finops_entitlements_schema.sql:/docker-entrypoint-initdb.d/003_create_cockpit_iam_finops_entitlements_schema.sql:ro
    networks:
      - aeos-net

  omniroute:
    build:
      context: ./OmniRoute
      dockerfile: Dockerfile
    image: omniroute:cli
    container_name: pcl-omniroute
    restart: always
    ports:
      - "${OMNIROUTE_BIND_ADDRESS:-127.0.0.1}:${OMNIROUTE_PORT:-20130}:20130"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./OmniRoute/.env
        required: false
    environment:
      - PORT=20130
      - DATA_DIR=/var/lib/omniroute
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-admin}
      - AUTH_DISABLED=${OMNIROUTE_AUTH_DISABLED:-0}
      - SKIP_LOGIN=${OMNIROUTE_SKIP_LOGIN:-0}
      - REQUIRE_LOGIN=${OMNIROUTE_REQUIRE_LOGIN:-true}
      - CONFIG_FILE=/var/lib/omniroute/config.yaml
      - OMNIROUTE_CLASSIFIER_PROVIDER=laya
      - OMNIROUTE_LAYA_ENDPOINT=http://pcl-laya:20140
      - OMNIROUTE_CLASSIFIER_FAILOVER_ENABLED=true
    depends_on:
      laya:
        condition: service_healthy
    volumes:
      - omniroute-data:/var/lib/omniroute
      - ./config/omniroute/config.yaml:/var/lib/omniroute/config.yaml:ro
    networks:
      - aeos-net

  paperclip:
    build:
      context: ./PaperClip
      dockerfile: Dockerfile
    container_name: pcl-paperclip
    restart: always
    ports:
      - "${PAPERCLIP_BIND_ADDRESS:-127.0.0.1}:${PAPERCLIP_PORT:-3100}:3100"
    depends_on:
      db:
        condition: service_healthy
      omniroute:
        condition: service_started
    env_file:
      - path: ./PaperClip/.env
        required: false
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-paperclip}:${POSTGRES_PASSWORD:-paperclip}@db:5432/${POSTGRES_DB:-paperclip}
      - OMNI_ROUTE_URL=http://omniroute:20130
      - OPENAI_API_BASE=http://omniroute:20130/v1
      - OPENAI_API_KEY=sk-omniroute-local
      - PCL_HOME=/app
      - COMPANIES_DIR=/app/companies
    volumes:
      - paperclip-storage:/app/storage
      - ./PaperClip-Companies:/app/companies
    networks:
      - aeos-net

  laya:
    build:
      context: ./services/pcl-laya
      dockerfile: Dockerfile
    image: pcl-laya:latest
    container_name: pcl-laya
    restart: always
    ports:
      - "${LAYA_BIND_ADDRESS:-127.0.0.1}:${LAYA_PORT:-20140}:20140"
    environment:
      - PORT=20140
      - ONNXRUNTIME_EXECUTION_PROVIDERS=CPUExecutionProvider
      - LAYA_REQUIRE_NEURAL=${LAYA_REQUIRE_NEURAL:-0}
      - LAYA_CPU_THREADS=${LAYA_CPU_THREADS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:20140/ready', timeout=3); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aeos-net

  laya-gatekeeper:
    build:
      context: ./services/laya-gatekeeper
      dockerfile: Dockerfile
    image: pcl-laya-gatekeeper:latest
    container_name: pcl-laya-gatekeeper
    restart: always
    ports:
      - "${GATEKEEPER_BIND_ADDRESS:-127.0.0.1}:${GATEKEEPER_PORT:-20160}:20160"
    environment:
      - GATEKEEPER_PORT=20160
      - ONNXRUNTIME_EXECUTION_PROVIDERS=CPUExecutionProvider
      - LAYA_URL=http://pcl-laya:20140
    depends_on:
      laya:
        condition: service_healthy
    networks:
      - aeos-net

  cockpit:
    build:
      context: ./projects/PromptCoreLabs_AEOS_Dashboard
      dockerfile: Dockerfile
    image: pcl-cockpit:latest
    container_name: pcl-cockpit
    restart: always
    ports:
      - "${COCKPIT_BIND_ADDRESS:-127.0.0.1}:${COCKPIT_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./.env
        required: false
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - AEOS_WORKSPACE_ROOT=/workspace
      - PG_HOST=db
      - PG_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-paperclip}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-paperclip}
      - POSTGRES_DB=${POSTGRES_DB:-paperclip}
      - OMNIROUTE_URL=http://omniroute:20130
      - LAYA_URL=http://pcl-laya:20140
      - PAPERCLIP_URL=http://paperclip:3100
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
      laya:
        condition: service_healthy
      omniroute:
        condition: service_started
    volumes:
      - ./PaperClip-Companies:/workspace/PaperClip-Companies
      - ./scripts/database/migrations:/workspace/scripts/database/migrations:ro
      - ./knowledge:/workspace/knowledge:ro
      - ./.agents/skills:/workspace/.agents/skills:ro
      - cockpit-vault:/workspace/data/cockpit-vault
    networks:
      - aeos-net

  caddy:
    image: caddy:2-alpine
    container_name: pcl-caddy
    restart: unless-stopped
    profiles:
      - vps-tls
    ports:
      - "80:80"
      - "443:443"
    environment:
      - COCKPIT_DOMAIN=${COCKPIT_DOMAIN:-localhost}
    depends_on:
      cockpit:
        condition: service_healthy
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - aeos-net

networks:
  aeos-net:
    driver: bridge

volumes:
  db-data:
  omniroute-data:
  paperclip-storage:
  cockpit-vault:
  caddy-data:
  caddy-config:
