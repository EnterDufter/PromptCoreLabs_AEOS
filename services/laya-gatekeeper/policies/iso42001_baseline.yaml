version: "1.0.0"
standard: "ISO/IEC 42001:2023 & LGPD Art. 46"
normative_ref: "PCL-AEOS-NORM-01"
engine: "PCL Aegis (PROAA-16)"
fallback_mode: "FAIL_CLOSED"
laya_timeout_ms: 25

rules:
  - id: "AEGIS-INJ-001"
    category: "prompt_injection"
    severity: "CRITICAL"
    action: "BLOCK"
    description: "Tentativa direta ou indireta de sobrescrever instruções de sistema, jailbreak ou desativação de guardrails."
  - id: "AEGIS-INJ-002"
    category: "obfuscated_injection"
    severity: "CRITICAL"
    action: "BLOCK"
    description: "Payload ofuscado (Base64/Hex) contendo diretivas maliciosas de override ou exfiltração."
  - id: "AEGIS-DLP-001"
    category: "pii_leakage"
    severity: "HIGH"
    action: "REDACT"
    strict_action: "BLOCK"
    description: "Exposição de Dados Pessoais (CPF, E-mail corporativo/pessoal) em trânsito de prompt ou output."
  - id: "AEGIS-DLP-002"
    category: "secret_exfiltration"
    severity: "CRITICAL"
    action: "BLOCK"
    description: "Exfiltração de chaves de API (OpenAI sk-, GitHub ghp_, Google AIza, Bearer Tokens, JWT)."
  - id: "AEGIS-SSRF-001"
    category: "ssrf_internal_network"
    severity: "CRITICAL"
    action: "BLOCK"
    description: "Tentativa de acesso não autorizado a endpoints internos (169.254.169.254, localhost, redes RFC1918 sensíveis)."
  - id: "AEGIS-NLI-001"
    category: "semantic_policy_violation"
    severity: "HIGH"
    action: "BLOCK"
    threshold: 0.72
    description: "Violação semântica detectada pela Camada 2 (Laya System One NLI) contra política corporativa."
