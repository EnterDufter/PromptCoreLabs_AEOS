[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-gatekeeper"
version = "1.0.0"
description = "PCL AEOS — Laya Security (PCL Aegis PROAA-16) & FinOps (Cortex Reflex PROAA-15) Out-of-Band Sidecar Gatekeeper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - PromptCore Labs" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
