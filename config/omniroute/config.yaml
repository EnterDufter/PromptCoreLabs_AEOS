# PCL AEOS OmniRoute Unified Gateway Configuration
# Mode: Multi-Provider Unified Gateway (v3.8.0 PROD)
#
# Estratégia de Recursos:
# 1. Provedores de Nuvem de Alta Precisão (Google Gemini, OpenAI, Anthropic, OpenRouter)
# 2. Modo Soberano Local ($0.00): Ollama Local (:11434 com qwen2.5-coder na GPU RTX 3050)
# 3. Laya Coprocessor em CPU host (:20140 com 0 MB VRAM)

gateway:
  name: "PCL AEOS Unified Gateway"
  port: 20130
  strategy: "smart_failover"
  timeout_ms: 35000
  log_level: "info"

providers:
  # Provedor 1: Google AI Studio (Gemini 3.5 / 3.6 / Pro) via OpenAI-compatible endpoint
  gemini_cloud:
    name: "Google AI Studio Cloud (Gemini)"
    type: "openai"
    enabled: true
    priority: 1
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key: "${GEMINI_API_KEY:-}"
    models:
      - id: "gemini-3.5-flash-lite"
        alias: "gemini-fast"
        context_length: 32768
      - id: "gemini-3.6-flash"
        alias: "gemini-main"
        context_length: 65536
      - id: "gemini-1.5-pro"
        alias: "gemini-pro"
        context_length: 128000
    health_check:
      enabled: false

  # Provedor 2: OpenAI Cloud Enterprise (GPT-4o / GPT-4o-mini)
  openai_cloud:
    name: "OpenAI Cloud Enterprise"
    type: "openai"
    enabled: true
    priority: 2
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY:-}"
    models:
      - id: "gpt-4o"
        alias: "gpt-4o"
        context_length: 128000
      - id: "gpt-4o-mini"
        alias: "gpt-fast"
        context_length: 128000
    health_check:
      enabled: false

  # Provedor 3: Anthropic Cloud (Claude 3.5 Sonnet / Haiku)
  anthropic_cloud:
    name: "Anthropic Claude Cloud"
    type: "anthropic"
    enabled: true
    priority: 3
    base_url: "https://api.anthropic.com/v1"
    api_key: "${ANTHROPIC_API_KEY:-}"
    models:
      - id: "claude-3-5-sonnet-20241022"
        alias: "claude-3-5-sonnet"
        context_length: 200000
      - id: "claude-3-haiku-20240307"
        alias: "claude-haiku"
        context_length: 200000
    health_check:
      enabled: false

  # Provedor 4: OpenRouter Unified Cloud
  openrouter_cloud:
    name: "OpenRouter Unified Cloud"
    type: "openai"
    enabled: true
    priority: 4
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY:-}"
    health_check:
      enabled: false

  # Provedor 5: Ollama Local (Modo Soberano $0.00 na GPU RTX 3050)
  ollama_local:
    name: "Ollama Local - Soberano $0.00 (GPU RTX)"
    type: "openai"
    enabled: true
    priority: 5
    on_demand_failover: true
    base_url: "http://host.docker.internal:11434/v1"
    api_key: "ollama"
    models:
      - id: "qwen2.5-coder:7b-instruct-q4_K_M"
        alias: "coder-fast"
        context_length: 8192
    health_check:
      enabled: true
      endpoint: "http://host.docker.internal:11434/v1/models"
      interval_seconds: 15
      timeout_ms: 3000

  # Provedor 6: LM Studio Local (Failover Nível 2)
  lmstudio_local:
    name: "LM Studio Local (MoE / Refatoração)"
    type: "openai"
    enabled: true
    priority: 6
    on_demand_failover: true
    base_url: "http://host.docker.internal:1234/v1"
    api_key: "lm-studio"
    models:
      - id: "deepseek-coder-v2-lite-instruct"
        alias: "coder-moe"
        context_length: 8192
    health_check:
      enabled: false

routing_rules:
  # Roteamento específico para Claude
  - match:
      model: "claude*"
    strategy: "failover"
    chain:
      - "anthropic_cloud"
      - "openrouter_cloud"
      - "gemini_cloud"

  # Roteamento específico para GPT-4
  - match:
      model: "gpt-4*"
    strategy: "failover"
    chain:
      - "openai_cloud"
      - "openrouter_cloud"
      - "gemini_cloud"

  # Roteamento específico para Gemini
  - match:
      model: "gemini*"
    strategy: "failover"
    chain:
      - "gemini_cloud"
      - "openrouter_cloud"

  # Roteamento específico para Qwen / Código Local
  - match:
      model: "qwen*"
    strategy: "failover"
    chain:
      - "ollama_local"
      - "gemini_cloud"

  # Regra Padrão Wildcard
  - match:
      model: "*"
    strategy: "failover"
    chain:
      - "gemini_cloud"
      - "openrouter_cloud"
      - "ollama_local"

failover_policy:
  enabled: true
  triggers:
    - "ENOTFOUND"
    - "ECONNREFUSED"
    - "ETIMEDOUT"
    - "FETCH_ERROR"
    - "HTTP_401"
    - "HTTP_429"
    - "HTTP_500"
    - "HTTP_502"
    - "HTTP_503"
    - "HTTP_504"
  max_retries_per_provider: 1
  retry_delay_ms: 500
