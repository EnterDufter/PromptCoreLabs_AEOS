services:
  db:
    image: postgres:17-alpine
    container_name: pcl-db
    restart: always
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  omniroute:
    build:
      context: ./OmniRoute
      dockerfile: Dockerfile
    image: omniroute:cli
    container_name: pcl-omniroute
    restart: always
    ports:
      - "20130:20130"
    env_file:
      - ./OmniRoute/.env
    environment:
      - PORT=20130
      - DATA_DIR=/var/lib/omniroute
      - INITIAL_PASSWORD=admin
      - AUTH_DISABLED=1
      - SKIP_LOGIN=1
      - REQUIRE_LOGIN=false
      - OMNIROUTE_CLASSIFIER_PROVIDER=laya
      - OMNIROUTE_LAYA_ENDPOINT=http://pcl-laya:20140
      - OMNIROUTE_CLASSIFIER_FAILOVER_ENABLED=true
    depends_on:
      - laya
    volumes:
      - omniroute-data:/var/lib/omniroute

  laya:
    build:
      context: ./services/pcl-laya
      dockerfile: Dockerfile
    image: pcl-laya:latest
    container_name: pcl-laya
    restart: always
    ports:
      - "20140:20140"
    environment:
      - PORT=20140
      - ONNXRUNTIME_EXECUTION_PROVIDERS=CPUExecutionProvider


  paperclip:
    build: 
      context: ./PaperClip
      dockerfile: Dockerfile
    container_name: pcl-paperclip
    restart: always
    ports:
      - "3100:3100"
    depends_on:
      - db
      - omniroute
    env_file:
      - ./PaperClip/.env
    environment:
      - DATABASE_URL=postgres://paperclip:paperclip@db:5432/paperclip
      - OMNI_ROUTE_URL=http://omniroute:20130
      - PCL_HOME=/app
      - COMPANIES_DIR=/app/companies
    volumes:
      - paperclip-storage:/app/storage
      - ./PaperClip-Companies:/app/companies

volumes:
  db-data:
  omniroute-data:
  paperclip-storage:
